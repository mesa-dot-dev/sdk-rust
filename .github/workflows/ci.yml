name: CI

on:
  push:
    branches:
      - staged

permissions:
  contents: write
  packages: write

jobs:
  build-ci-image:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Check for Dockerfile.ci changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dockerfile:
              - 'Dockerfile.ci'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.dockerfile == 'true'
        uses: useblacksmith/setup-docker-builder@v1

      - name: Log in to GitHub Container Registry
        if: steps.filter.outputs.dockerfile == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.filter.outputs.dockerfile == 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: ghcr.io/mesa-dot-dev/sdk-rust-ci:latest

  lint-and-release:
    needs: build-ci-image
    runs-on: blacksmith-8vcpu-ubuntu-2404
    container:
      image: ghcr.io/mesa-dot-dev/sdk-rust-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: staged
          fetch-depth: 0

      - name: Run clippy on mesa-dev
        run: cargo clippy -p mesa-dev --no-deps -- -D warnings

      - name: Check formatting of mesa-dev
        run: cargo fmt -p mesa-dev --check

      - name: Run tests
        timeout-minutes: 10
        env:
          MESA_TEST_API_KEY: ${{ secrets.MESA_TEST_API_KEY }}
          MESA_TEST_ORG: ${{ secrets.MESA_TEST_ORG }}
        run: cargo test --workspace

      - name: Bump minor version
        id: bump
        run: |
          for crate in crates/mesa-dev/Cargo.toml crates/mesa-dev-oapi/Cargo.toml; do
            CURRENT=$(dasel -f "$crate" '.package.version')
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEW="${MAJOR}.$((MINOR + 1)).0"
            dasel put -f "$crate" -t string -v "$NEW" '.package.version'
          done

          NEW_VERSION=$(dasel -f crates/mesa-dev/Cargo.toml '.package.version')
          cargo check -p mesa-dev

      - name: Commit and push version bump
        run: |
          git config user.name "mesa-ci[bot]"
          git config user.email "ci-bot@mesa.dev"

          git add crates/mesa-dev/Cargo.toml crates/mesa-dev-oapi/Cargo.toml Cargo.lock
          git commit -m "Bump mesa-dev to ${{ steps.bump.outputs.new_version }}"
          git push origin staged

      - name: Fast-forward merge staged into main
        run: |
          git checkout main
          git merge --ff-only staged
          git push origin main

  on-failure:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: ${{ always() && (needs.lint-and-release.result == 'failure' || needs.lint-and-release.result == 'timed_out') }}
    needs:
      - lint-and-release
      - build-ci-image
    steps:
    - uses: actions/checkout@v2
    - name: Slack Notification
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_USERNAME: mesa-gh
        SLACK_TITLE: Workflow ${{ needs.lint-and-release.result }}
        MSG_MINIMAL: actions url
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
