name: Accept Proto Update

on:
  repository_dispatch:
    types: [proto_update]

concurrency:
  group: accept-proto
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  accept-proto:
    runs-on: ubuntu-latest
    env:
      PROTO_DIR: crates/mesa-dev/proto
    steps:
      - name: Validate payload
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "$PAYLOAD" | jq -e '.commit | type == "string"' > /dev/null 2>&1 \
            || { echo "::error::Missing or invalid 'commit' in payload"; exit 1; }
          echo "$PAYLOAD" | jq -e '.run_id | type == "number"' > /dev/null 2>&1 \
            || { echo "::error::Missing or invalid 'run_id' in payload"; exit 1; }
          echo "$PAYLOAD" | jq -e '.artifact_name | type == "string"' > /dev/null 2>&1 \
            || { echo "::error::Missing or invalid 'artifact_name' in payload"; exit 1; }
          echo "$PAYLOAD" | jq -e '.bufDeps | type == "array"' > /dev/null 2>&1 \
            || { echo "::error::Missing or invalid 'bufDeps' array in payload"; exit 1; }
          echo "$PAYLOAD" | jq -e '.protoFiles | type == "array"' > /dev/null 2>&1 \
            || { echo "::error::Missing or invalid 'protoFiles' array in payload"; exit 1; }
          echo "Payload validated successfully"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/grpc

      - name: Install buf CLI
        uses: bufbuild/buf-setup-action@v1

      - name: Prepare proto directory
        run: |
          rm -rf "$PROTO_DIR"
          mkdir -p "$PROTO_DIR"

      - name: Download buf modules
        env:
          BUF_ENTRIES: ${{ toJson(github.event.client_payload.bufDeps) }}
        run: |
          echo "$BUF_ENTRIES" | jq -c '.[]' | while read -r entry; do
            name=$(echo "$entry" | jq -r '.name')
            commit=$(echo "$entry" | jq -r '.commit')
            digest=$(echo "$entry" | jq -r '.digest')
            echo "::group::buf module: ${name}@${commit} (digest: ${digest})"
            buf export "${name}:${commit}" --output "$PROTO_DIR"
            echo "::endgroup::"
          done

      - name: Download proto artifact from depot
        env:
          GH_TOKEN: ${{ secrets.DEPOT_TOKEN }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
          ARTIFACT_NAME: ${{ github.event.client_payload.artifact_name }}
        run: |
          gh run download "$RUN_ID" \
            --repo mesa-dot-dev/depot \
            --name "$ARTIFACT_NAME" \
            --dir proto-download

      - name: Install proto files with integrity check
        env:
          PROTO_ENTRIES: ${{ toJson(github.event.client_payload.protoFiles) }}
        run: |
          echo "$PROTO_ENTRIES" | jq -c '.[]' | while read -r entry; do
            name=$(echo "$entry" | jq -r '.name')
            sha=$(echo "$entry" | jq -r '.sha256')
            echo "::group::proto file: ${name}"
            cp "proto-download/${name}" "${PROTO_DIR}/${name}"
            echo "${sha}  ${PROTO_DIR}/${name}" | sha256sum -c -
            echo "::endgroup::"
          done

      - name: List downloaded files
        run: find "$PROTO_DIR" -type f -name '*.proto' | sort

      - name: Commit and push proto update
        env:
          SOURCE_COMMIT: ${{ github.event.client_payload.commit }}
        run: |
          git config user.name "mesa-ci[bot]"
          git config user.email "ci-bot@mesa.dev"

          git add crates/mesa-dev/proto/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update proto files from depot@${SOURCE_COMMIT}"
          git push origin feat/grpc
